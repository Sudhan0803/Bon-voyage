<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BON-VOYAGE | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --accent: #f72585;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --border-radius: 12px;
            --shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* Intro Animation Container */
        .intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeOut 0.5s ease 2.5s forwards;
        }
        
        /* Bus Animation */
        .bus-animation {
            position: relative;
            width: 100%;
            height: 100px;
            margin-bottom: 50px;
            overflow: hidden;
        }
        
        .bus-icon {
            position: absolute;
            left: -100px;
            font-size: 80px;
            color: white;
            animation: driveIn 2s ease forwards;
        }
        
        /* Intro Text */
        .intro-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 48px;
            color: white;
            letter-spacing: 2px;
            text-align: center;
            opacity: 0;
            animation: fadeInOut 2s ease 0.5s forwards;
        }
        
        /* Login Container */
        .login-container {
            width: 100%;
            max-width: 450px;
            opacity: 0;
            animation: fadeIn 0.5s ease 3s forwards;
        }
        
        .login-card {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: var(--shadow);
        }
        
        /* Animations */
        @keyframes driveIn {
            0% {
                left: -100px;
                transform: scale(0.5);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                left: calc(50% - 40px);
                transform: scale(1);
            }
        }
        
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            20% {
                opacity: 1;
                transform: translateY(0);
            }
            80% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px);
            }
        }
        
        @keyframes fadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        /* Road and scenery */
        .road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: #333;
        }
        
        .road-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(
                to right,
                yellow 0px,
                yellow 20px,
                transparent 20px,
                transparent 40px
            );
            transform: translateY(-50%);
        }
        
        /* Login Form Styles */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .logo i {
            font-size: 40px;
            color: var(--primary);
            margin-right: 15px;
        }
        
        .logo h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 32px;
            color: var(--primary);
            letter-spacing: 1px;
        }
        
        .form-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
            color: var(--dark);
        }
        
        .form-subtitle {
            text-align: center;
            color: var(--gray);
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }
        
        .form-control {
            width: 100%;
            padding: 15px;
            border: 1px solid #e9ecef;
            border-radius: var(--border-radius);
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
        }
        
        .remember-me input {
            margin-right: 8px;
        }
        
        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .btn {
            padding: 15px;
            border-radius: var(--border-radius);
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .signup-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        
        .signup-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        /* Clouds for background */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            z-index: -1;
        }
        
        .cloud:nth-child(1) {
            width: 100px;
            height: 40px;
            top: 20%;
            left: 10%;
            animation: float 20s infinite linear;
        }
        
        .cloud:nth-child(2) {
            width: 150px;
            height: 60px;
            top: 40%;
            right: 10%;
            animation: float 25s infinite linear reverse;
        }
        
        .cloud:nth-child(3) {
            width: 80px;
            height: 30px;
            bottom: 30%;
            left: 20%;
            animation: float 18s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateX(-100px);
            }
            100% {
                transform: translateX(calc(100vw + 100px));
            }
        }
    </style>
</head>
<body>
    <!-- Intro Animation -->
    <div class="intro-container" id="introContainer">
        <div class="bus-animation">
            <i class="fas fa-bus bus-icon"></i>
            <div class="road">
                <div class="road-line"></div>
            </div>
        </div>
        <div class="intro-text">BON-VOYAGE</div>
    </div>
    
    <!-- Clouds -->
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    
    <!-- Login Form -->
    <div class="login-container" id="loginContainer">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-plane-departure"></i>
                <h1>BON-VOYAGE</h1>
            </div>
            
            <h2 class="form-title">Welcome Back!</h2>
            <p class="form-subtitle">Sign in to access your travel plans</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
            
            <div class="signup-link">
                <p>Don't have an account? <a href="#" id="signupLink">Sign up here</a></p>
            </div>
        </div>
    </div>

    <script>
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simple validation
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            // For demo purposes, accept any non-empty credentials
            if (email && password) {
                // Show loading effect
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
                submitBtn.disabled = true;
                
                // Simulate API call delay
                setTimeout(() => {
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> Login Successful!';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                }, 1500);
            }
        });
        
        // Handle signup link
        document.getElementById('signupLink').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Sign up feature coming soon! For now, please use the login form with any credentials.');
            document.getElementById('email').focus();
        });
        
        // Handle forgot password
        document.querySelector('.forgot-password').addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt('Enter your email address to reset password:');
            if (email) {
                alert(`Password reset link has been sent to ${email}. Please check your inbox.`);
            }
        });
        
        // Remove intro container after animation completes
        setTimeout(() => {
            const introContainer = document.getElementById('introContainer');
            if (introContainer) {
                introContainer.style.display = 'none';
            }
        }, 3000); // 3 seconds total (2.5s animation + 0.5s fade out)
    </script>
</body>
</html>
